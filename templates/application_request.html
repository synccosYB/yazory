{% extends 'base.html' %}{% block content %}
<section class="intake-sheet application-admin">
  <div class="application-heading"><div><h1>{{ _('Send family assistance application') }}</h1><p>{{ _('Enter the email address of the person who should complete the application. This may be the applicant, a family member, an askan, or a Rav.') }}</p></div><img src="{{ url_for('static', filename='yazory-logo.png') }}" alt="Yazory · יעזורי"></div>
  <form method="post" class="application-request-form"><input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ _('Email to send application to') }}<input type="email" name="recipient_email" required autocomplete="email" placeholder="name@example.com" value="{{ request.form.get('recipient_email','') }}"></label>
    <label>{{ _('Applicant / family name') }} <small>{{ _('optional') }}</small><input name="applicant_name" autocomplete="name" value="{{ request.form.get('applicant_name','') }}"></label>
    <div class="application-actions"><a class="button quiet" href="{{ url_for('applications') }}">{{ _('Cancel') }}</a><button type="submit">{{ _('Send application link') }}</button></div>
  </form>
</section>
{% endblock %}
