<!doctype html><html lang="{{ language }}" dir="{{ direction }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ _('Donation received') }} · Yazory</title><link rel="icon" href="{{ url_for('static',filename='favicon-32.png') }}"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="portal-body"><main class="portal-shell"><div class="portal-brand"><img src="{{ url_for('static',filename='yazory-logo.png') }}" alt="Yazory · יעזורי"></div><section class="card padded"><div class="eyebrow">{{ _('STRIPE PAYMENT') }}</div><h1>{{ _('Thank you for your donation') }}</h1><p>{{ _('Stripe is securely processing your payment. Yazory will send the receipt after payment confirmation.') }}</p><p><strong>{{ payment.amount_cents|money }}</strong> · {{ _(payment.frequency) }}</p><a class="button" href="{{ url_for('supporter_portal') }}">{{ _('Back to my account') }}</a></section></main></body></html>
