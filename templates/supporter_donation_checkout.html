<!doctype html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ _('Donation checkout') }} · Yazory</title>
  <link rel="icon" href="{{ url_for('static',filename='favicon-32.png') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='donation.css') }}">
</head>
<body class="portal-body"><main class="portal-shell portal-wide">
  <header class="portal-header"><img src="{{ url_for('static',filename='yazory-logo.png') }}" alt="Yazory · יעזורי"><div><div class="eyebrow">{{ _('SECURE DONATION') }}</div><h1>{{ supporter.name }}</h1></div><a class="button secondary" href="{{ url_for('supporter_portal') }}">{{ _('Back to my account') }}</a></header>
  <section class="card padded donation-native-card">
    <p>{{ _('Enter the donation here. Card details are secured directly by Stripe without leaving Yazory.') }}</p>
    <form id="donation-options" action="{{ url_for('native_payment_submit', contact_id=supporter.id) }}" data-stripe-key="{{ stripe_publishable_key }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="form-grid">
        <label>{{ _('Amount ($)') }}<input name="amount" type="number" min="1" max="1000000" step="0.01" value="{{ '%.2f'|format(default_amount) }}" required></label>
        <label>{{ _('Frequency') }}<select name="frequency">{% for frequency in pledge_frequencies %}<option value="{{ frequency }}"{% if frequency == default_frequency %} selected{% endif %}>{{ _(frequency) }}</option>{% endfor %}</select></label>
        <label>{{ _('Name on card') }}<input name="billing_name" autocomplete="cc-name" value="{{ supporter.name }}" required></label>
        <label>{{ _('Email for receipt') }}<input name="billing_email" type="email" autocomplete="email" value="{{ supporter.email }}"></label>
      </div>
      <div class="field-stack"><label>{{ _('Card information') }}</label><div id="card-element" class="stripe-card-field"></div><p id="card-errors" class="muted" role="alert"></p></div>
      <button id="donation-submit" type="submit">{{ _('Process donation') }}</button>
      <p class="muted">{{ _('Yazory never receives or stores the card number or CVC.') }}</p>
      <p id="donation-error" class="flash error" role="alert" hidden></p>
    </form>
  </section>
</main><script src="https://js.stripe.com/v3/"></script><script src="{{ url_for('static',filename='donation.js') }}" defer></script></body></html>
