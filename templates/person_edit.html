{% extends 'base.html' %}{% from 'macros.html' import token with context %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">{{ _('PERSON') }}</div><h1>{{ _('Edit person') }}</h1><p>{{ _('These details belong to the person, not to a supporter, applicant, askan, or other role.') }}</p></div><a class="button secondary" href="{{ url_for('person_hub',person_id=person.id) }}">{{ _('Cancel') }}</a></div>
<form class="card padded" method="post">{{ token(csrf) }}<div class="form-grid">
<label>{{ _('English name') }}<input name="name_english" value="{{ english_name }}" maxlength="160"></label><label>{{ _('Yiddish name') }}<input name="name_yiddish" value="{{ yiddish_name }}" maxlength="160" dir="rtl"></label>
<label>{{ _('Phone') }}<input name="phone" value="{{ person.phone or '' }}" dir="ltr"></label><label>{{ _('Home phone') }}<input name="home_phone" value="{{ person.home_phone or '' }}" dir="ltr"></label><label>{{ _('Cell phone') }}<input name="cell_phone" value="{{ person.cell_phone or '' }}" dir="ltr"></label><label>{{ _('Email') }}<input name="email" value="{{ person.email or '' }}" type="email" dir="ltr"></label>
<label>{{ _('Home address') }}<input name="home_address" value="{{ person.home_address or '' }}"></label><label>{{ _('City') }}<input name="city" value="{{ person.city or '' }}"></label><label>{{ _('State') }}<input name="state" value="{{ person.state or '' }}"></label><label>{{ _('ZIP') }}<input name="zip_code" value="{{ person.zip_code or '' }}" dir="ltr"></label><label>{{ _('Workplace') }}<input name="workplace" value="{{ person.workplace or '' }}"></label><label>{{ _('Work phone') }}<input name="work_phone" value="{{ person.work_phone or '' }}" dir="ltr"></label></div><button>{{ _('Save person') }}</button></form>{% endblock %}
