<details class="card padded add-supporter-panel no-print" id="add-supporter" {% if request.args.get("add") %}open{% endif %}>
<summary>{{ _('+ Add a new person') }}</summary>
<form method="post" action="{{ url_for('add_contact') if families else '#' }}">
<input type="hidden" name="relationship_group" value="{{ relationship_group|default('') }}">
<input type="hidden" name="return_to" value="{{ return_to|default('directory') }}">
{% set imported_profiles = imported_supporter_profiles() %}
<div class="form-grid">{{ token(csrf) }}<label>{{ _('Family') }}<select name="family_id" id="supporter-family">{% for family in families %}<option value="{{ family.id }}" {{ 'selected' if family.id==selected_family_id }}>{{ family.name }}</option>{% endfor %}</select>
</label>
<label>{{ _('Choose from imported people') }}<span class="field-hint">{{ _('Search by name, phone, or email') }}</span><input type="search" class="select-search" data-select-filter="imported-supporter-profile" placeholder="{{ _('Search people') }}" autocomplete="off"><select name="supporter_profile_id" id="imported-supporter-profile"><option value="">{{ _('Enter a new person below') }}</option>{% for profile in imported_profiles %}<option value="{{ profile.id }}">{{ profile.name }} · {{ profile.phone|phone }}{% if profile.email %} · {{ profile.email }}{% endif %}</option>{% endfor %}</select>
</label>
<label>{{ _('Name *') }}<input name="name" required maxlength="160">
</label>
<label>{{ _('Relationship') }}<select name="relationship">{% for relationship in relationships %}<option value="{{ relationship }}"{% if (relationship_group|default('') == 'siblings' and relationship == 'Sibling') or (relationship_group|default('') == 'nephews' and relationship == 'Nephew') %} selected{% endif %}>{{ _(relationship) }}</option>{% endfor %}</select>
</label>
<label>{{ _('Whose son or son-in-law is he?') }}<input type="search" class="select-search" data-select-filter="new-parent-contact" placeholder="{{ _('Search names') }}" autocomplete="off">
<select name="parent_contact_id" id="new-parent-contact">
<option value="">{{ _('Not connected under another supporter') }}</option>{% for family in families %}{% if family.father %}<option value="family-father" data-family-id="{{ family.id }}">{{ family.father }} · {{ _('Applicant’s father') }}</option>{% endif %}{% if family.inlaws %}<option value="family-inlaws" data-family-id="{{ family.id }}">{{ family.inlaws }} · {{ _('Applicant’s father-in-law') }}</option>{% endif %}{% endfor %}{% for parent in possible_parents %}<option value="{{ parent.id }}" data-family-id="{{ parent.family_id }}">{{ parent.name }} · {{ _(parent.relationship) }}{% if parent.phone %} · {{ parent.phone|phone }}{% endif %}</option>{% endfor %}</select>
</label>
<label>{{ _('What is he to that supporter?') }}<select name="parent_connection">
<option value="">{{ _('Choose') }}</option>
<option value="Son">{{ _('Son') }}</option>
<option value="Son-in-law">{{ _('Son-in-law') }}</option>
</select>
</label>
<label>{{ _('Cell phone') }}<input name="cell_phone" maxlength="80" autocomplete="tel">
</label>
<label>{{ _('Home phone') }}<input name="home_phone" maxlength="80" autocomplete="tel">
</label>
<label>{{ _('Email address') }}<input name="email" type="email" maxlength="254" autocomplete="email">
</label>
<label>{{ _('Donation amount ($)') }}<input type="number" name="monthly" min="0" max="1000000" step="0.01" value="0" required>
</label>
<label>{{ _('Donation frequency') }}<select name="pledge_frequency">{% for frequency in pledge_frequencies %}<option value="{{ frequency }}">{{ _(frequency) }}</option>{% endfor %}</select>
</label>
<label>{{ _('Outreach status') }}<select name="status">{% for status in contact_statuses %}<option value="{{ status }}">{{ _(status) }}</option>{% endfor %}</select>
</label>
</div>
<button {% if not families %}disabled{% endif %}>{{ _('Add supporter') }}</button>
</form>
</details>
