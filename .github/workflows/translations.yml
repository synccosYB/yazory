name: Translation Sheet Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: translation-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'synccosYB/yazory'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull approved translations
        env:
          GOOGLE_TRANSLATIONS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TRANSLATIONS_CREDENTIALS_JSON }}
        run: python -m flask --app 'app_entry:create_app()' translations-pull
      - name: Push newly discovered labels
        env:
          GOOGLE_TRANSLATIONS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TRANSLATIONS_CREDENTIALS_JSON }}
        run: python -m flask --app 'app_entry:create_app()' translations-push
      - name: Verify locale contracts
        run: python -m pytest -q tests/test_translation_sheet.py tests/test_screen_contracts.py
      - name: Commit approved wording
        run: |
          if git diff --quiet -- translation_sheet_overrides.json; then
            exit 0
          fi
          git config user.name 'Yazory Translation Sync'
          git config user.email 'translations@users.noreply.github.com'
          git add translation_sheet_overrides.json
          git commit -m 'Sync approved Yiddish translations'
          git pull --rebase origin main
          git push origin HEAD:main
